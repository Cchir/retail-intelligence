name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Lint
        run: uv run ruff check src tests dashboard scripts notebooks/*.py
      - name: Unit tests + dashboard smoke test (uses committed serving data)
        run: uv run pytest -q

  pipeline:
    # Full end-to-end rebuild from the public source on every push to main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Extract, transform, load, quality checks, analysis, export
        run: uv run retail all
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
